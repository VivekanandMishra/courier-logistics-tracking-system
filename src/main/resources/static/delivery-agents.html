<!DOCTYPE html>
<html>

<head>

    <title>Delivery Agents</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>Delivery Agent Management</h1>

<table>

<tr>
<td>First Name</td>
<td><input type="text" id="firstName"></td>
</tr>

<tr>
<td>Last Name</td>
<td><input type="text" id="lastName"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="email" id="email"></td>
</tr>

<tr>
<td>Phone</td>
<td><input type="text" id="phoneNo"></td>
</tr>

<tr>
<td>Vehicle Type</td>
<td><input type="text" id="vehicleType"></td>
</tr>

<tr>
<td>Vehicle Number</td>
<td><input type="text" id="vehicleNumber"></td>
</tr>

</table>

<br>

<button onclick="saveAgent()">Save Agent</button>

<button onclick="getAgents()">Load Agents</button>

<br><br>

<table border="1">

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Vehicle</th>

</tr>

</thead>

<tbody id="agentTable">

</tbody>

</table>

<script src="js/agent.js"></script>

</body>

</html>
