
<!DOCTYPE html>
<html>
<head>
    <title>Delivery Agents</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>Delivery Agent Management</h1>

<form id="agentForm">

    <label>Agent Code</label>
    <input type="text" id="agentCode" required>

    <label>First Name</label>
    <input type="text" id="firstName" required>

    <label>Last Name</label>
    <input type="text" id="lastName" required>

    <label>Email</label>
    <input type="email" id="email" required>

    <label>Phone No</label>
    <input type="text" id="phoneNo" required>

    <label>Vehicle Type</label>
    <input type="text" id="vehicleType" required>

    <label>Vehicle Number</label>
    <input type="text" id="vehicleNumber" required>

    <label>Driving License No</label>
    <input type="text" id="drivingLicenseNo" required>

    <label>Current Location</label>
    <input type="text" id="currentLocation" required>

    <label>Available</label>
    <input type="checkbox" id="available" checked>

    <label>Joining Date</label>
    <input type="date" id="joiningDate" required>

    <label>Salary</label>
    <input type="number" id="salary" required>

    <br><br>

    <!-- SAVE BUTTON -->
    <button type="button" onclick="saveAgent()">
        Save Agent
    </button>

    <!-- LOAD BUTTON -->
    <button type="button" onclick="getAgents()">
        Load Agents
    </button>

</form>


<h2>Delivery Agents</h2>

<table border="1">

    <thead>
        <tr>
            <th>ID</th>
            <th>Agent Code</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Vehicle Type</th>
            <th>Vehicle Number</th>
            <th>Driving License</th>
            <th>Current Location</th>
            <th>Available</th>
            <th>Joining Date</th>
            <th>Salary</th>
        </tr>
    </thead>

    <tbody id="agentTable">
    </tbody>

</table>


<script src="js/delivery-agents.js"></script>

</body>
</html>
