<!DOCTYPE html>
<html>

<head>

    <title>Tracking History</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>Tracking History</h1>

<table>

<tr>
    <td>Shipment ID</td>
    <td><input type="number" id="shipmentId"></td>
</tr>

<tr>
    <td>Status</td>
    <td>
        <select id="status">
            <option value="CREATED">CREATED</option>
            <option value="PICKED_UP">PICKED_UP</option>
            <option value="IN_TRANSIT">IN_TRANSIT</option>
            <option value="OUT_FOR_DELIVERY">OUT_FOR_DELIVERY</option>
            <option value="DELIVERED">DELIVERED</option>
            <option value="CANCELLED">CANCELLED</option>
        </select>
    </td>
</tr>

<tr>
    <td>Location</td>
    <td><input type="text" id="location"></td>
</tr>

<tr>
    <td>Remarks</td>
    <td><input type="text" id="remarks"></td>
</tr>

</table>

<br>

<button onclick="saveTracking()">Save Tracking</button>

<button onclick="getTrackingHistory()">Load Tracking</button>

<br><br>

<table border="1">

<thead>

<tr>
    <th>ID</th>
    <th>Shipment ID</th>
    <th>Status</th>
    <th>Location</th>
    <th>Remarks</th>
</tr>

</thead>

<tbody id="trackingTable">

</tbody>

</table>

<script src="js/tracking.js"></script>

</body>

</html>
